<div *ngIf="isLoading()">
  <ngx-skeleton-loader count="4" appearance="line"></ngx-skeleton-loader>
<br>
<ngx-skeleton-loader
    count="3"
    appearance="square">
  </ngx-skeleton-loader>
  </div>
<div *ngIf="!isLoading()">
  <form [formGroup]="loginForm" (ngSubmit)="submitForm()">
    <label>Name:</label>
    <input type="text" formControlName="name">

    <div *ngIf="loginForm.get('name')?.invalid && loginForm.get('name')?.touched">
      <small *ngIf="loginForm.get('name')?.errors?.['required']">
        Name is required
      </small>
      <small *ngIf="loginForm.get('name')?.errors?.['minlength']">
        Minimum 3 characters required
      </small>
    </div><br><br>

    <label>Email:</label>
    <input type="email" formControlName="email">

    <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
      <small *ngIf="loginForm.get('email')?.errors?.['required']">
        Email is required
      </small>
      <small *ngIf="loginForm.get('email')?.errors?.['email']">
        Invalid email
      </small>
    </div><br><br>

    <label>Password:</label>
    <input type="password" formControlName="password">

    <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
      <small *ngIf="loginForm.get('password')?.errors?.['required']">
        Password is required
      </small>
      <small *ngIf="loginForm.get('password')?.errors?.['minlength']">
        Minimum 6 characters required
      </small>
    </div><br><br>

    <button type="submit" [disabled]="loginForm.invalid">
      Submit
    </button>
    <button type="button" (click)="resetForm()">
      Reset
    </button>
    <button type="button" (click)="setName()">
      Set Name
    </button>
  </form>
</div>

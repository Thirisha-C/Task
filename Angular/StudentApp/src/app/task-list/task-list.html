
<h4>Task List</h4>
<button routerLink="/addTask">Add Task</button>

<table>
    <tr>
        <th>Title</th>
        <th>Assigned To</th>
        <th>Priority</th>
        <th>Due date</th>
        <th>Status</th>
        <th>Actions</th>
    </tr>
    <tr *ngFor="let task of tasks">
        <td>{{task.title}}</td>
        <td>{{task.assignedTo}}</td>
        <td [ngClass]="{ 'high': task.priority === 'High'}">
            {{task.priority}}</td>
        <td>{{task.dueDate}}</td>
        <td>{{task.status}}</td>
        <td>
            <button (click)="viewTask(task.id)">View</button>
            <button (click)="editTask(task.id)">Edit</button>
            <button (click)="deleteTask(task.id)">Delete</button>
        </td>
    </tr>
</table>

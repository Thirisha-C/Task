
<link rel="stylesheet" href="style.css">
<form id="userForm">
    <label>Name: </label> 
    <input type="text" id="name" placeholder="Enter your Name"><br><br>

    <label class="city">City: </label> 
    <input class="City" type="text" id="city" placeholder="Enter City"><br><br>

    <label class="add">Address: </label>
    <textarea class="add" id="address" placeholder="Enter Address"></textarea><br><br>

    <label>Contact Number: </label> 
    <input type="tel" id="number" maxlength="10" placeholder="Enter number"><br><br>

    <label>Email: </label> 
    <input type="email" id="email" placeholder="Enter email"><br><br>

    <button type="submit">Submit</button>
</form>
<script src="script.js"></script>
